services:
  # Транзакционная база данных (OLTP)
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Аналитическая база данных (OLAP)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ecommerce_clickhouse
    restart: always
    ports:
      - "8123:8123" # HTTP интерфейс (для Python/Power BI)
      - "9000:9000" # Native интерфейс
    environment:
      CLICKHOUSE_DB: ecommerce_olap
      CLICKHOUSE_USER: bi_user
      CLICKHOUSE_PASSWORD: bi_password
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  pgdata:
  chdata:
